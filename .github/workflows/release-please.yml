name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # GitHub documents that a pull request opened with the default
          # GITHUB_TOKEN does not trigger other workflows, which would leave the
          # release PR without the `test` check main requires. Measured in the
          # sibling omacento repository, that did not happen: the release PR got
          # its check four seconds later with no PAT configured. The override is
          # here anyway, because the documented behaviour is what to expect if it
          # ever starts -- and closing and reopening the PR is the no-secret way
          # out.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
